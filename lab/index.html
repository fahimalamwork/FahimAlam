<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Lab — Fahim Alam</title>
  <meta name="description" content="A contact sheet of 16 things Fahim Alam has built: products, client sites, games and experiments." />
  <meta name="author" content="Fahim Alam" />
  <meta name="theme-color" content="#121211" />
  <meta property="og:title" content="The Lab — Fahim Alam" />
  <meta property="og:description" content="A contact sheet of 16 things I've built." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23111111'/%3E%3Crect x='30' y='30' width='40' height='40' fill='%23e5481b'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="title">
        <a href="../" class="back" aria-label="Back to the main site">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
        </a>
        <div>
          <h1>The Lab</h1>
          <p class="mono sub">Contact sheet · 16 frames · 2025 — 2026</p>
        </div>
      </div>
      <div class="filters" role="group" aria-label="Filter frames" id="filters"></div>
    </div>
  </header>

  <main class="layout">
    <section class="sheet" aria-label="Projects">
      <div class="sheet-head mono"><span>FA · LAB · ROLL 01</span><span class="hint">← → STEP · ENTER OPEN</span></div>
      <ol class="frames" id="frames"></ol>
    </section>

    <aside class="loupe" aria-label="Selected project" aria-live="polite">
      <div class="loupe-head mono"><span>LOUPE</span><span id="loupe-count">01 / 16</span></div>
      <div class="loupe-media" id="loupe-media"></div>
      <div class="loupe-body">
        <span class="mono kind" id="loupe-kind"></span>
        <h2 id="loupe-name"></h2>
        <p class="tagline" id="loupe-tagline"></p>
        <p class="desc" id="loupe-desc"></p>
        <div class="loupe-actions">
          <button type="button" class="step" id="prev" aria-label="Previous project">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
          </button>
          <button type="button" class="step" id="next" aria-label="Next project">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
          </button>
          <a class="open" id="loupe-open" target="_blank" rel="noopener">Open live site
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 9L9 3M4 3h5v5"/></svg>
          </a>
          <span class="mono no-link" id="loupe-status" hidden></span>
        </div>
      </div>
    </aside>
  </main>

  <script src="lab.js" defer></script>
</body>
</html>
